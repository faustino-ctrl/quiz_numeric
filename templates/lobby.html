<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="tela">

        <div class="card">

            <h1 class="titulo-secundario">{{ nome }}</h1>

            <p class="subtitulo">Escolha o próximo passo</p>

            <div class="grupo-botoes">

                <form action="{{ url_for('configurar_partida') }}" method="GET">
                    <button type="submit" class="botao">
                        Criar sala
                    </button>
                </form>

                <form action="{{ url_for('pagina_entrar_sala') }}" method="GET">
                    <button type="submit" class="botao">
                        Entrar em sala
                    </button>
                </form>

                <a href="{{ url_for('logout') }}" class="botao-link confirmar-logout">
                    Sair da conta
                </a>

            </div>

        </div>

    </div>
    <script src="{{ url_for('static', filename='js/global.js') }}"></script>
</body>

</html>
