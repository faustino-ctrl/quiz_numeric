<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="tela">
        <div class="info-float">
            <a href="{{ url_for('sobre') }}" class="info-botao" title="Sobre o jogo">!</a>
        </div>

        <div class="card">
            <p class="texto-topo">ACESSAR CONTA</p>
            <h1 class="titulo-secundario">Login</h1>

            {% if erro %}
                <p class="mensagem erro">{{ erro }}</p>
            {% endif %}

            {% if sucesso %}
                <p class="mensagem sucesso">{{ sucesso }}</p>
            {% endif %}

            <form action="{{ url_for('logar') }}" method="POST" class="form-vertical">
                <label>Nome de usuário</label>
                <input type="text" name="username" class="input" maxlength="5" required>

                <label>Senha</label>
                <input type="password" name="senha" class="input" required>

                <button type="submit" class="botao">Entrar</button>
            </form>

            <p class="texto-link">
                <a href="{{ url_for('recuperar') }}">Esqueci minha senha ou usuário</a>
            </p>
        </div>
    </div>
</body>
</html>
