<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Numérico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="tela">
        <div class="info-float">
            <a href="{{ url_for('sobre') }}" class="info-botao" title="Sobre o jogo">!</a>
        </div>

        <div class="card">
            <h1 class="titulo-secundario">Escolha uma opção</h1>
            <br>

            {% if usuario_logado %}
                <p class="subtitulo">Você já está logada como <strong>{{ usuario_logado }}</strong></p>

                <div class="grupo-botoes">
                    <a href="{{ url_for('lobby') }}" class="botao-link">Continuar</a>
                    <a href="{{ url_for('trocar_conta') }}" class="botao-link">Entrar em outra conta</a>
                    <a href="{{ url_for('logout') }}" class="botao-link confirmar-logout">Sair</a>
                </div>
            {% else %}

                <div class="grupo-botoes">
                    <a href="{{ url_for('login') }}" class="botao-link">Login</a>
                    <a href="{{ url_for('cadastro') }}" class="botao-link">Cadastrar</a>
                </div>
            {% endif %}
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/global.js') }}"></script>
</body>
</html>
