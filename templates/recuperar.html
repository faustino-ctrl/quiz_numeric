<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="tela">
        <div class="card">
            <p class="texto-topo">RECUPERAR CONTA</p>
            <h1 class="titulo-secundario">Recuperação</h1>

            {% if erro %}
                <p class="mensagem erro">{{ erro }}</p>
            {% endif %}

            <form action="{{ url_for('buscar_conta') }}" method="POST" class="form-vertical">
                <label>Email</label>
                <input type="email" name="email" class="input" required>

                <button type="submit" class="botao">Continuar</button>
            </form>
        </div>
    </div>
</body>
</html>
